<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>抜取検査計算機 テスト</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f4f6f8; color: #15212c; }
  h1 { font-size: 1.1rem; }
  table { border-collapse: collapse; font-size: .85rem; }
  td, th { border-bottom: 1px solid #d5dce3; padding: 4px 8px; text-align: left; }
  .ok { color: #17703a; } .ng { color: #ad2a22; font-weight: bold; }
</style>
</head>
<body>
<h1>計算ライブラリの照合（scipy 参照値・MIL-STD-105E 既知値）</h1>
<p id="sum"></p>
<table id="t"><thead><tr><th>種類</th><th>条件</th><th>計算値</th><th>参照値</th><th>結果</th></tr></thead><tbody></tbody></table>
<script src="../js/aql-table.js"></script>
<script src="../js/stats.js"></script>
<script src="reference.js"></script>
<script src="check.js"></script>
<script>
// 照合ロジックは check.js（Node の test.js と共用）
const rows = runChecks(window.SampStats, AQL_TABLE, REFERENCE);
const fails = rows.filter(r => !r[4]).length;
document.getElementById('sum').innerHTML = fails ? `<span class="ng">${fails} 件不一致</span> / ${rows.length} 件` : `<span class="ok">全 ${rows.length} 件一致</span>`;
document.querySelector('#t tbody').innerHTML = rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${typeof r[2] === 'number' ? r[2].toPrecision(10) : r[2]}</td><td>${typeof r[3] === 'number' ? r[3].toPrecision(10) : r[3]}</td><td class="${r[4] ? 'ok' : 'ng'}">${r[4] ? '一致' : '不一致'}</td></tr>`).join('');
</script>
</body>
</html>
